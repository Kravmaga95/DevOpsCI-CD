name: CI/CD Pipeline with Flyway

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # Paso 1: Verificar el código fuente
    - name: Checkout repository
      uses: actions/checkout@v2

    # Paso 2: Instalar Flyway usando apt
    - name: Descargar y configurar Flyway manualmente
      run: |
        # Descargar el archivo tar.gz de Flyway
        curl -sSL https://repo.flywaydb.org/flyway/flyway-9.15.0-linux-x64.tar.gz -o flyway.tar.gz
        # Extraer el archivo
        tar -xzf flyway.tar.gz
        # Mover el ejecutable a /usr/local/bin para que sea accesible globalmente
        sudo mv flyway-*/flyway /usr/local/bin/
        # Verificar la instalación
        flyway -v




    # Paso 3: Configuración de la base de datos para la migración en Demo
    - name: Configurar base de datos demo
      run: |
        # Aquí puedes agregar la lógica para conectar a la base de datos demo
        echo "Conectando a la base de datos de demo..."
        # Agregar comandos Flyway para migrar la base de datos demo
        flyway -url=jdbc:sqlserver://demo-server;databaseName=demoDB -user=admin -password=${{ secrets.DEMO_DB_PASSWORD }} migrate

    # Paso 4: Verificación de migración en demo (solo si paso anterior es exitoso)
    - name: Verificar migración de demo
      run: |
        # Verificar el estado de las migraciones en la base de datos demo
        flyway -url=jdbc:sqlserver://demo-server;databaseName=demoDB -user=admin -password=${{ secrets.DEMO_DB_PASSWORD }} info
        echo "Migración de demo completada exitosamente"

    # Paso 5: Migrar la base de datos de producción si demo es exitoso
    - name: Migrar base de datos producción
      if: success()  # Solo se ejecuta si la migración de demo es exitosa
      run: |
        # Aquí puedes agregar la lógica para conectar a la base de datos de producción
        echo "Conectando a la base de datos de producción..."
        # Agregar comandos Flyway para migrar la base de datos de producción
        flyway -url=jdbc:sqlserver://prod-server;databaseName=prodDB -user=admin -password=${{ secrets.PROD_DB_PASSWORD }} migrate

    # Paso 6: Verificación de migración en producción (solo si paso anterior es exitoso)
    - name: Verificar migración de producción
      if: success()  # Solo se ejecuta si la migración de producción es exitosa
      run: |
        # Verificar el estado de las migraciones en la base de datos de producción
        flyway -url=jdbc:sqlserver://prod-server;databaseName=prodDB -user=admin -password=${{ secrets.PROD_DB_PASSWORD }} info
        echo "Migración de producción completada exitosamente"

    # Paso 7: Confirmar el push solo si todas las migraciones fueron exitosas
    - name: Confirmar cambios
      if: success()  # Solo se ejecuta si todas las migraciones fueron exitosas
      run: |
        echo "Las migraciones fueron exitosas, ahora se pueden confirmar los cambios."
