name: CI/CD Pipeline with Flyway

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # Paso 1: Verificar el código fuente
    - name: Checkout repository
      uses: actions/checkout@v2

    # Paso 2: Usar la acción Flyway Migration
    - name: Ejecutar Flyway Migration en base de datos Demo
      uses: flyway/flyway-migration-action@v1.0.0
      with:
        url: 'jdbc:sqlserver://demo-server;databaseName=demoDB'
        user: 'admin'
        password: ${{ secrets.DEMO_DB_PASSWORD }}
        locations: 'filesystem:/migrations'  # Asegúrate de que la carpeta "migrations" esté en tu repo

    # Paso 3: Verificación de migración en demo (solo si paso anterior es exitoso)
    - name: Verificar migración en demo
      run: |
        flyway -url=jdbc:sqlserver://demo-server;databaseName=demoDB -user=admin -password=${{ secrets.DEMO_DB_PASSWORD }} info
        echo "Migración de demo completada exitosamente"

    # Paso 4: Migrar la base de datos de producción si demo es exitoso
    - name: Ejecutar Flyway Migration en base de datos Producción
      if: success()  # Solo se ejecuta si la migración de demo es exitosa
      uses: flyway/flyway-migration-action@v1.0.0
      with:
        url: 'jdbc:sqlserver://prod-server;databaseName=prodDB'
        user: 'admin'
        password: ${{ secrets.PROD_DB_PASSWORD }}
        locations: 'filesystem:/migrations'  # Asegúrate de que la carpeta "migrations" esté en tu repo

    # Paso 5: Verificación de migración en producción (solo si paso anterior es exitoso)
    - name: Verificar migración de producción
      if: success()  # Solo se ejecuta si la migración de producción es exitosa
      run: |
        flyway -url=jdbc:sqlserver://prod-server;databaseName=prodDB -user=admin -password=${{ secrets.PROD_DB_PASSWORD }} info
        echo "Migración de producción completada exitosamente"

    # Paso 6: Confirmar los cambios solo si todas las migraciones fueron exitosas
    - name: Confirmar cambios
      if: success()  # Solo se ejecuta si todas las migraciones fueron exitosas
      run: |
        echo "Las migraciones fueron exitosas, ahora se pueden confirmar los cambios."
