name: CI/CD Pipeline with Flyway

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    # Paso 1: Verificar el código fuente
    - name: Checkout repository
      uses: actions/checkout@v2

    # Paso 2: Instalar Flyway manualmente con la última versión
    - name: Install Flyway
      run: |
        curl -sSL https://repo1.maven.org/maven2/org/flywaydb/flyway-commandline/11.3.1/flyway-commandline-11.3.1-linux-x64.tar.gz -o flyway.tar.gz
        tar -xzf flyway.tar.gz
        mv flyway-11.3.1 /opt/flyway
        echo "/opt/flyway" >> $GITHUB_PATH
        chmod +x /opt/flyway/flyway
        /opt/flyway/flyway -v  # Verifica que Flyway está instalado

    # Paso 3: Validar la existencia del directorio migrations
    - name: Verificar directorio de migraciones
      run: |
        if [ ! -d "migrations" ]; then echo "ERROR: Directorio migrations no encontrado"; exit 1; fi

    # Paso 4: Ejecutar Flyway Migration en base de datos Demo
    - name: Migrar base de datos Demo
      run: |
        flyway -url="jdbc:sqlserver://1IHTPORTHV4H:1433;authentication=sqlPassword;databaseName=prueba;encrypt=true;trustServerCertificate=true" \
               -user="admin" \
               -password="admin" \
               -locations="filesystem:migrations" \
               migrate

    # Paso 5: Verificar migración en demo
    - name: Verificar migración en Demo
      run: |
        flyway -url="jdbc:sqlserver://1IHTPORTHV4H:1433;authentication=sqlPassword;databaseName=prueba;encrypt=true;trustServerCertificate=true" \
               -user="admin" \
               -password="admin" \
               info
        echo "Migración en Demo completada exitosamente"

    # Paso 6: Migrar la base de datos de Producción si Demo fue exitoso
    - name: Migrar base de datos Producción
      if: success()
      run: |
        flyway -url="jdbc:sqlserver://prod-server:1433;authentication=sqlPassword;databaseName=prodDB;encrypt=true;trustServerCertificate=true" \
               -user="admin" \
               -password="${{ secrets.PROD_DB_PASSWORD }}" \
               -locations="filesystem:migrations" \
               migrate

    # Paso 7: Verificar migración en producción
    - name: Verificar migración en Producción
      if: success()
      run: |
        flyway -url="jdbc:sqlserver://prod-server:1433;authentication=sqlPassword;databaseName=prodDB;encrypt=true;trustServerCertificate=true" \
               -user="admin" \
               -password="${{ secrets.PROD_DB_PASSWORD }}" \
               info
        echo "Migración en Producción completada exitosamente"

    # Paso 8: Confirmar cambios si todas las migraciones fueron exitosas
    - name: Confirmar cambios
      if: success()
      run: |
        echo "Todas las migraciones fueron exitosas. Listo para confirmar cambios."
