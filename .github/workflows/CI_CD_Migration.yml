name: CI/CD Pipeline with Flyway

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # Paso 1: Verificar el código fuente
    - name: Checkout repository
      uses: actions/checkout@v2

    # Paso 2: Instalar Flyway en el runner
    - name: Instalar Flyway
      run: |
        wget -qO- https://repo1.maven.org/maven2/org/flywaydb/flyway-commandline/10.6.0/flyway-commandline-10.6.0-linux-x64.tar.gz | tar xvz
        sudo mv flyway-10.6.0 /opt/flyway
        sudo ln -s /opt/flyway/flyway /usr/local/bin/flyway
        flyway -v  # Verificar instalación

    # Paso 3: Ejecutar migración en base de datos Demo
    - name: Ejecutar migración en base de datos Demo
      run: |
        flyway -url="jdbc:sqlserver://demo-server;databaseName=demoDB" \
               -user="admin" \
               -password="${{ secrets.DEMO_DB_PASSWORD }}" \
               -locations="filesystem:./migrations" migrate

    # Paso 4: Verificar migración en Demo
    - name: Verificar migración en Demo
      run: |
        flyway -url="jdbc:sqlserver://demo-server;databaseName=demoDB" \
               -user="admin" \
               -password="${{ secrets.DEMO_DB_PASSWORD }}" info
        echo "Migración de Demo completada exitosamente"

    # Paso 5: Ejecutar migración en base de datos Producción (si la de demo es exitosa)
    - name: Ejecutar migración en base de datos Producción
      if: success()
      run: |
        flyway -url="jdbc:sqlserver://prod-server;databaseName=prodDB" \
               -user="admin" \
               -password="${{ secrets.PROD_DB_PASSWORD }}" \
               -locations="filesystem:./migrations" migrate

    # Paso 6: Verificar migración en Producción
    - name: Verificar migración en Producción
      if: success()
      run: |
        flyway -url="jdbc:sqlserver://prod-server;databaseName=prodDB" \
               -user="admin" \
               -password="${{ secrets.PROD_DB_PASSWORD }}" info
        echo "Migración de Producción completada exitosamente"

    # Paso 7: Confirmar los cambios
    - name: Confirmar cambios
      if: success()
      run: echo "Las migraciones fueron exitosas, ahora se pueden confirmar los cambios."
