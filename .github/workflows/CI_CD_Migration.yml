name: CI/CD con Flyway (Demo -> Producción)

on:
  push:
    branches:
      - main  # Se ejecuta cuando se hace un push a la rama principal

jobs:
  validate-demo:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Run Flyway Migrations on Demo
      uses: flyway/flyway-migration@v2.1.0
      with:
        url: jdbc:sqlserver://${{ secrets.DB_HOST_DEMO }}:${{ secrets.DB_PORT }};databaseName=${{ secrets.DB_NAME }}
        user: ${{ secrets.DB_USER }}
        password: ${{ secrets.DB_PASSWORD }}
        locations: filesystem:sql/migrations
        validateOnMigrate: true  # Validar antes de ejecutar migraciones
        migrate: true  # Ejecutar las migraciones

    - name: Check Flyway Migration Success on Demo
      run: |
        if [ $? -ne 0 ]; then
          echo "Migración en Demo fallida. Abortando despliegue."
          exit 1
        fi

  validate-prod:
    runs-on: ubuntu-latest
    needs: validate-demo  # Este paso solo se ejecuta si el paso anterior fue exitoso

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Run Flyway Migrations on Production
      uses: flyway/flyway-migration@v2.1.0
      with:
        url: jdbc:sqlserver://${{ secrets.DB_HOST_PROD }}:${{ secrets.DB_PORT }};databaseName=${{ secrets.DB_NAME }}
        user: ${{ secrets.DB_USER }}
        password: ${{ secrets.DB_PASSWORD }}
        locations: filesystem:sql/migrations
        validateOnMigrate: true  # Validar antes de ejecutar migraciones
        migrate: true  # Ejecutar las migraciones

    - name: Check Flyway Migration Success on Production
      run: |
        if [ $? -ne 0 ]; then
          echo "Migración en Producción fallida. Abortando despliegue."
          exit 1
        fi

  notify-errors:
    runs-on: ubuntu-latest
    if: failure()  # Este paso solo se ejecuta si alguno de los pasos anteriores falla

    steps:
    - name: Notify Migration Failure
      run: |
        echo "Se han producido errores en la migración. Revisa los logs para detalles."
        # Aquí puedes agregar cualquier lógica para enviar un correo, generar un reporte, etc.
