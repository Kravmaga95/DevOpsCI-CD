name: CI/CD con Flyway (Demo -> Producción)

on:
  push:
    branches:
      - main  # Ejecutar cuando haya un push a la rama principal

jobs:
  validate-demo:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

steps:
    - name: Descargar Flyway
      run: |
        curl -sSL https://repo.flywaydb.org/getflyway.sh -o getflyway.sh
        bash getflyway.sh
        ls -alh
        sudo mv flyway*/flyway /usr/local/bin
        flyway -v

    - name: Configuración de Flyway para Demo
      run: |
        echo "flyway.url=jdbc:sqlserver://${{ secrets.DB_HOST_DEMO }}:${{ secrets.DB_PORT }};databaseName=${{ secrets.DB_NAME }}" > flyway.conf
        echo "flyway.user=${{ secrets.DB_USER }}" >> flyway.conf
        echo "flyway.password=${{ secrets.DB_PASSWORD }}" >> flyway.conf

    - name: Ejecutar migraciones en Demo
      run: |
        flyway -configFiles=flyway.conf migrate
        # Mostrar el estado de las migraciones
        flyway -configFiles=flyway.conf info

    - name: Validar que la migración en Demo fue exitosa
      run: |
        if [ $? -ne 0 ]; then
          echo "La migración en Demo falló. Abortando despliegue."
          exit 1
        fi

  validate-prod:
    runs-on: ubuntu-latest
    needs: validate-demo  # Solo si el paso de Demo es exitoso

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Descargar e instalar Flyway
      run: |
        # Descargar Flyway
        curl -sSL https://repo.flywaydb.org/getflyway.sh | bash
        # Mover Flyway a una ubicación accesible
        sudo mv flyway*/flyway /usr/local/bin
        # Verificar la instalación de Flyway
        flyway -v

    - name: Configuración de Flyway para Producción
      run: |
        echo "flyway.url=jdbc:sqlserver://${{ secrets.DB_HOST_PROD }}:${{ secrets.DB_PORT }};databaseName=${{ secrets.DB_NAME }}" > flyway.conf
        echo "flyway.user=${{ secrets.DB_USER }}" >> flyway.conf
        echo "flyway.password=${{ secrets.DB_PASSWORD }}" >> flyway.conf

    - name: Ejecutar migraciones en Producción
      run: |
        flyway -configFiles=flyway.conf migrate
        # Mostrar el estado de las migraciones
        flyway -configFiles=flyway.conf info

    - name: Validar que la migración en Producción fue exitosa
      run: |
        if [ $? -ne 0 ]; then
          echo "La migración en Producción falló. Abortando despliegue."
          exit 1
        fi

  notify-errors:
    runs-on: ubuntu-latest
    if: failure()  # Este paso solo se ejecuta si alguno de los pasos anteriores falla

    steps:
    - name: Notificar falla de migración
      run: |
        echo "Se han producido errores en la migración. Revisa los logs para más detalles."
        # Aquí puedes agregar cualquier lógica para enviar un correo, generar un reporte, etc.
